[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "pandas>=2.2.2",
    "pydantic>=2",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aggregate_pep_data*"]
