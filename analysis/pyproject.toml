[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pep-compass-analysis"
version = "0.0.1"
description = "Analysis scripts and tools for pep-compass"
requires-python = ">=3.11, <4"

dependencies = [
    "pandas>=2.2.2",
    "loguru>=0.7.3",
    "tqdm",
    "pydantic",
    "pyyaml",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
micdiff-app = "scripts.micdiff.micdiff_app:main"
compute-diff-app = "scripts.micdiff.compute_diff_app:main"
apex-predict = "scripts.apex.predict.predict:main"
mutang-enumerate = "scripts.mutang.enumerate_mutations_single_position.enumerate_mutations_single_position:main"
