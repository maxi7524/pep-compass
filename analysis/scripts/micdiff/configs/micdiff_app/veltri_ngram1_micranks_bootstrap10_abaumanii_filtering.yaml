# Configuration for mutation difference analysis - Veltri dataset

# Pairs: List of parent-mutant pairs to process
# Each pair will be processed separately, generating diff DataFrame and bootstrap statistics
pairs:
  # Veltri Negative pairs
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_negative.csv
    mutant: results/apex_predictions/results/mutants/veltri_negative/all/veltri_negative_direction_threshold=0.0001_token_threshold=0.05_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_negative/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_negative.csv
    mutant: results/apex_predictions/results/mutants/veltri_negative/all/veltri_negative_direction_threshold=0.001_token_threshold=0.1_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_negative/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_negative.csv
    mutant: results/apex_predictions/results/mutants/veltri_negative/all/veltri_negative_direction_threshold=0.01_token_threshold=0.2_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_negative/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering
  # Veltri Positive pairs
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_positive.csv
    mutant: results/apex_predictions/results/mutants/veltri_positive/all/veltri_positive_direction_threshold=0.0001_token_threshold=0.05_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_positive/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_positive.csv
    mutant: results/apex_predictions/results/mutants/veltri_positive/all/veltri_positive_direction_threshold=0.001_token_threshold=0.1_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_positive/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering
  - parent: results/apex_predictions/data/hydramp/veltri/all/veltri_positive.csv
    mutant: results/apex_predictions/results/mutants/veltri_positive/all/veltri_positive_direction_threshold=0.01_token_threshold=0.2_jacobian_mode=approx.csv
    output_dir: results/micdiff/veltri_positive/all/veltri_ngram1_micranks_bootstrap10_abaumanii_filtering

# Diff: Configuration for computing differences between parent and mutant values
# This section defines how to merge parent and mutant datasets and compute differences
diff:
  # Column name in parents dataset used to match/merge with mutants (e.g., sequence ID or name)
  match_col_parents: Name
  # Column name in mutants dataset that references the parent (must match match_col_parents values)
  match_col_mutants: parent_name
  # List of numeric columns to compute differences for (mutant_value - parent_value)
  # These columns should exist in both parent and mutant datasets
  value_cols: ['A. baumannii ATCC 19606',
                'E. coli ATCC 11775',
                'E. coli AIG221',
                'E. coli AIG222',
                'K. pneumoniae ATCC 13883',
                'P. aeruginosa PA01',
                'P. aeruginosa PA14',
                'S. aureus ATCC 12600',
                'S. aureus (ATCC BAA-1556) - MRSA',
                'vancomycin-resistant E. faecalis ATCC 700802',
                'vancomycin-resistant E. faecium ATCC 700221',
                'A. muciniphila ATCC BAA-835',
                'B. fragilis ATCC25285',
                'B. vulgatus ATCC8482',
                'C. aerofaciens ATCC25986',
                'C. scindens ATCC35704',
                'B. thetaiotaomicron ATCC29148',
                'B. thetaiotaomicron Complemmented',
                'B. thetaiotaomicron Mutant',
                'B. uniformis ATCC8492',
                'B. eggerthi ATCC27754',
                'C. spiroforme ATCC29900',
                'P. distasonis ATCC8503',
                'P. copri DSMZ18205',
                'B. ovatus ATCC8483',
                'E. rectale ATCC33656',
                'C. symbiosum',
                'R. obeum',
                'R. torques',
                'E. coli Nissle',
                'Salmonella enterica ATCC 9150 (BEIRES NR-515)',
                'Salmonella enterica (BEIRES NR-170)',
                'Salmonella enterica ATCC 9150 (BEIRES NR-174)',
                'L. monocytogenes ATCC 19111 (BEIRES NR-106)']
  # Preprocessing to apply before computing differences: null (no preprocessing) or "log" (natural logarithm)
  value_preprocessing: null  # Options: null, "log"
  # Whether to compute relative differences: (mutant - parent) / parent
  add_relative: true

# Mutation: Configuration for detecting and analyzing mutations between parent and mutant sequences
# This section defines how to identify n-gram mutations (subsequence changes)
mutation:
  # Column name containing parent sequences in the diff DataFrame
  parent_col: parent
  # Column name containing mutant sequences in the diff DataFrame
  mutant_col: mutant
  # Size of n-grams for mutation detection (e.g., 1 = single amino acid, 3 = tripeptide)
  ngram_size: 1
  # Whether to allow overlapping n-grams (True) or use non-overlapping windows (False)
  # Overlapping: slide window by 1 position. Non-overlapping: slide window by ngram_size positions
  allow_ngrams_overlap: true

# Bootstrap: Configuration for bootstrap sampling
# Bootstrap sampling generates multiple resampled datasets to assess statistical variability
bootstrap:
  # Number of bootstrap samples to generate
  n_bootstrap_samples: 10
  # Columns to group by for bootstrapping (null = rowwise bootstrapping)
  # If specified, entire groups are resampled together (useful for maintaining group structure)
  bootstrap_group_cols: null  # Columns to group by (null for rowwise bootstrapping)
  # Columns to stratify by (maintains distribution of these columns across bootstrap samples)
  stratify_cols: null  # Columns to stratify by
  # Fraction of data to use in each bootstrap sample (typically 1.0 for full bootstrap)
  bootstrap_frac: 1.0
  # Random seed for reproducibility (null = random seed each run)
  seed: 42

# Rank: Configuration for ranking mutations based on aggregated values
# After computing bootstrap samples, mutations are ranked by their aggregated values
rank:
  # Function to aggregate values within a bootstrap sample: "mean" (average) or "sum" (total)
  # For each mutation, all occurrence values are aggregated, then ranked against all mutations
  aggregation_func: mean  # Options: "mean", "sum"

# Filter: Configuration for filtering mutation data
# These filters remove unwanted rows before analysis
filter:
  # Remove rows where parent sequence equals mutant sequence (no mutations)
  filter_identities: true  # Filter out cases where parent == mutant
  # Remove rows where parent and mutant have different lengths after stripping whitespace
  filter_length_mismatch: true  # Filter out cases with different lengths after strip
  # Remove duplicate rows where both parent and mutant sequences are identical
  deduplicate: true  # Remove duplicate rows (same parent and mutant)

# Parent Filters: Optional filtering criteria applied to parent dataset
# Each filter creates a separate analysis run with filtered data
# The analysis runs separately for each filter, creating subdirectories in output
parent_filters:
  # Filter by A. baumannii ATCC 19606 MIC value
  - name: abaumannii_mic_filter
    columns:
      - column: "A. baumannii ATCC 19606"
        filter_config:
          dtype: float
          # Example: Filter for MIC values <= 32 (adjust min/max as needed)
          # Set min to None for no lower bound, max to None for no upper bound
          min: None  # Minimum MIC value (inclusive)
          max: 32  # Maximum MIC value (inclusive)
      - column: "A. baumannii ATCC 19606"
        filter_config:
          dtype: float
          # Example: Filter for MIC values <= 32 (adjust min/max as needed)
          # Set min to None for no lower bound, max to None for no upper bound
          min: 32  # Minimum MIC value (inclusive)
          max: None  # Maximum MIC value (inclusive)