experiment:
  name: composable_sorbes_mutang
  seed: 1234
  input:
    sequences:
    - FLYKWWIRIGRLKL
  output_directory: results/composable_example
tracking:
  level: short
  max_depth: null
  store_latents: true
  store_fields: false
autoencoder:
  method: hydramp
  device: cpu
  parameters:
    jacobian_eps: 0.001
    field_eps: 0.001
  model: article_25
pipeline:
  limits:
    oracle_calls: null
    generated_candidates: 1000000
  steps:
  - loop:
      iterations: 10
      steps:
      - walker:
          method: sorbes
          parameters:
            horizontal_threshold: 0.001
            time_step: 0.01
            max_horizontal_update_norm: 0.1
            vertical_movement: false
      - mutation_generator:
          method: mutang
          parameters:
            max_len: 25
            direction_significance_threshold: 0.001
            min_number_of_directions: 5
            token_threshold: 0.1
      - filter:
          method: deduplicate
          parameters:
            key: sequence_and_latent
