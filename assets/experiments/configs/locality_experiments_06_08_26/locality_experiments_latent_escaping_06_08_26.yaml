experiment:
  name: locality_experiments_latent_escaping_06_08_26
  seed: 1234
  seed_scope: task
  input:
    sequences:
    - FLYKWWIRIGRLKL
    repetitions: 3
  grid:
    steps.0.loop.steps.0.parallel.steps.0.loop.steps.1.mutation_generator.parameters.direction_significance_threshold:
    - 1.0e-06
    - 1.0e-05
    - 0.0001
    steps.0.loop.steps.0.parallel.steps.0.loop.steps.3.filter.parameters.mode:
    - random
    - highest
    - lowest
  output_directory: experiments/results/locality_experiments_latent_escaping_06_08_26/run
tracking:
  level: all
  max_depth: null
  store_latents: true
  store_fields: true
  field_names:
  - filter.LpbeboFilter.score
execution:
  backend: local
  max_workers: 1
autoencoder:
  method: hydramp
  device: cuda
  parameters:
    jacobian_mode: approx
    jacobian_eps: 0.001
    field_eps: 0.001
  model: article_25
pipeline:
  limits:
    generated_candidates: 1000000
  steps:
  - loop:
      iterations: 1
      steps:
      - parallel:
          replicas: 5
          execution: sequential
          merge: concatenate
          steps:
          - loop:
              iterations: 5
              steps:
              - walker:
                  method: sorbes
                  parameters:
                    horizontal_threshold: 0.001
                    time_step: 0.01
                    max_horizontal_update_norm: 0.1
                    vertical_movement: false
              - mutation_generator:
                  method: mutang
                  parameters:
                    max_len: 25
                    direction_significance_threshold: 1.0e-06
                    min_number_of_directions: 5
                    token_threshold: 0.1
                    maximum_candidates: 100000
              - filter:
                  method: lpbebo
                  parameters:
                    top_p: 1.0
                    temperature: 1.0
                    maximum_candidates: 100
              - filter:
                  method: candidate_subset
                  parameters:
                    count: 3
                    mode: random
                    score_field: filter.LpbeboFilter.score
