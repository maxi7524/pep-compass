experiment:
  name: locality_experiments_mutang_intersection_06_08_26
  seed: 1234
  seed_scope: task
  input:
    sequences:
    - FLYKWWIRIGRLKL
    repetitions: 1
  grid:
    steps.2.filter.parameters.mode:
    - random
    - highest
    - lowest
  output_directory: experiments/results/locality_experiments_mutang_intersection_06_08_26/run
tracking:
  level: all
  max_depth: null
  store_latents: true
  store_fields: true
  field_names:
  - filter.LpbeboFilter.score
execution:
  backend: local
  max_workers: 1
autoencoder:
  method: hydramp
  device: cuda
  parameters:
    jacobian_mode: approx
    jacobian_eps: 0.001
    field_eps: 0.001
  model: article_25
pipeline:
  limits:
    generated_candidates: 200000
  steps:
  - mutation_generator:
      method: mutang
      parameters:
        max_len: 25
        direction_significance_threshold: 1.0e-06
        min_number_of_directions: 5
        token_threshold: 0.1
  - filter:
      method: lpbebo
      parameters:
        top_p: 1.0
        temperature: 1.0
  - filter:
      method: candidate_subset
      parameters:
        count: 20
        mode: grid_option
        score_field: filter.LpbeboFilter.score
  - mutation_generator:
      method: mutang
      parameters:
        max_len: 25
        direction_significance_threshold: 1.0e-06
        min_number_of_directions: 5
        token_threshold: 0.1
        maximum_candidates: 100000
  - filter:
      method: lpbebo
      parameters:
        top_p: 1.0
        temperature: 1.0
  - filter:
      method: lpbebo
      parameters:
        top_p: 1.0
        temperature: 1.0
