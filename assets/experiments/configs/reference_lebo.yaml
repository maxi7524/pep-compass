experiment:
  name: reference_lebo_lpbebo_apex
  seed: 1234
  input:
    sequences:
    - FLYKWWIRIGRLKL
    repetitions: 1
  output_directory: experiments/results/reference_lebo/run
tracking:
  level: normal
  max_depth: null
  store_latents: false
  store_fields: true
execution:
  backend: local
  max_workers: 1
  slurm:
    job_name: pep-reference-lebo
    time: '24:00:00'
    cpus_per_task: 4
    mem: 16G
autoencoder:
  method: hydramp
  device: gpu
  parameters:
    jacobian_mode: approx
    jacobian_eps: 0.001
    field_eps: 0.001
  model: article_25
pipeline:
  limits:
    oracle_calls: 400
    generated_candidates: 1000000
  steps:
  - loop:
      iterations: 1000
      steps:
      - parallel:
          replicas: 10
          execution: auto
          merge: concatenate
          steps:
          - loop:
              iterations: 10
              steps:
              - walker:
                  method: sorbes
                  parameters:
                    horizontal_threshold: 0.001
                    time_step: 0.01
                    max_horizontal_update_norm: 0.1
                    vertical_movement: false
              - mutation_generator:
                  method: mutang
                  parameters:
                    max_len: 25
                    direction_significance_threshold: 1e-6
                    min_number_of_directions: 5
                    token_threshold: 0.1
      - filter:
          method: lpbebo
          parameters:
            top_p: 0.9
            temperature: 1.0
            maximum_candidates: 30000
      - filter:
          method: deduplicate
          parameters:
            key: sequence_and_latent
      - filter:
          method: trust_region
          parameters:
            objective: apex
            geometry: sequence
            initial_radius: 4
      - filter:
          method: robot
          parameters:
            objective: apex
            batch_size: 1
            maximize: false
            diversity_threshold: 2
            acquisition_batch_size: 64
            standardize: false
            device: gpu
      - oracle:
          method: apex
          parameters:
            mic_aggregate: mean
            mic_bacteria: all
            device: cpu
            evaluation_batch_size: 128
      - filter:
          method: trust_region_update
          parameters:
            objective: apex
            initial_radius: 4
            minimum_radius: 1
            maximum_radius: 12
            expand_factor: 2.0
            shrink_factor: 0.5
            success_tolerance: 3
            failure_tolerance: 3
            maximize: false
