experiment:
  name: composable_sorbes_mutang
  seed: 1234
  input:
    sequences:
      - FLYKWWIRIGRLKL
  tracking:
    level: short
    max_depth: null

encoder_decoder:
  method: hydramp
  device: cpu
  parameters:
    jacobian_eps: 0.001
    field_eps: 0.001

optimization:
  steps:
    - loop:
        iterations: 10
        steps:
          - walker:
              method: sorbes
              parameters:
                horizontal_threshold: 0.001
                time_step: 0.01
                max_horizontal_update_norm: 0.1
                vertical_movement: false

          - mutation_generator:
              method: mutang
              parameters:
                max_len: 25
                direction_significance_threshold: 0.001
                min_number_of_directions: 5
                token_threshold: 0.1

          - filter:
              method: deduplicate
              parameters:
                key: sequence_and_latent

  # Oracle is deliberately optional. Without it, the result contains final
  # candidates and null objective summary fields.
