experiment:
  name: reference_lebo_lpbebo_apex
  seed: 1234
  input:
    sequences:
      - FLYKWWIRIGRLKL
    repetitions: 1
  output:
    directory: results/reference_lebo
  tracking:
    level: normal
    max_depth: null
    store_latents: false
    store_fields: false

encoder_decoder:
  method: hydramp
  device: cpu
  parameters:
    jacobian_mode: approx
    jacobian_eps: 0.001
    field_eps: 0.001

optimization:
  limits:
    oracle_calls: 100
    generated_candidates: 1000000
  steps:
    - loop:
        iterations: 100
        steps:
          - walker:
              method: sorbes
              parameters:
                horizontal_threshold: 0.001
                time_step: 0.01
                max_horizontal_update_norm: 0.1
                vertical_movement: false

          - mutation_generator:
              method: mutang
              parameters:
                max_len: 25
                direction_significance_threshold: 0.001
                min_number_of_directions: 5
                token_threshold: 0.1

          - filter:
              method: lpbebo
              parameters:
                top_p: 0.9
                temperature: 1.0
                maximum_candidates: 30000

          - filter:
              method: deduplicate
              parameters:
                key: sequence_and_latent

          - filter:
              method: robot
              parameters:
                objective: apex
                batch_size: 1
                maximize: false
                diversity_threshold: 2
                acquisition_batch_size: 64
                standardize: false
                device: cpu

          - oracle:
              method: apex
              parameters:
                mic_aggregate: mean
                mic_bacteria: all
                device: cpu
                evaluation_batch_size: 128
